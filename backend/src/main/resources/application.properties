
# ==========================================
# APPLICATION
# ==========================================

spring.application.name=researchconnect-backend
server.port=8081


# ==========================================
# DATABASE CONFIGURATION
# ==========================================

spring.datasource.url=${RESEARCHCONNECT_DB_URL:jdbc:postgresql://127.0.0.1:5432/researchconnect}
spring.datasource.username=${RESEARCHCONNECT_DB_USERNAME:researchconnect_app}
spring.datasource.password=${RESEARCHCONNECT_DB_PASSWORD}

spring.datasource.hikari.pool-name=ResearchConnectHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# ==========================================
# FLYWAY
# ==========================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true


# ==========================================
# ACTUATOR
# ==========================================

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
